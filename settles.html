<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Measuring of Soft Things — What Settles</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0806; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script src="lib/matter-js/build/matter.min.js"></script>
<script>
(function () {
  const { Engine, Bodies, Composite, Body } = Matter;
  const W = 800, H = 800, TAU = Math.PI * 2;
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // seeded rng
  let seed0 = 190407;
  function rng() { seed0 = (seed0 * 1103515245 + 12345) & 0x7fffffff; return seed0 / 0x7fffffff; }
  function rand(a, b) { return a + (b - a) * rng(); }

  // ---------------- tray geometry (shared by bg + dynamic pass) ----------------
  const TR = { cx: 400, cy: 379, rx: 92, farRy: 5, nearRy: 6, botRy: 15 };
  const uOf = x => (x - TR.cx) / TR.rx;
  const farY = x => TR.cy - TR.farRy * Math.sqrt(Math.max(0, 1 - uOf(x) * uOf(x)));
  const nearY = x => TR.cy + TR.nearRy * Math.sqrt(Math.max(0, 1 - uOf(x) * uOf(x)));
  const botY = x => TR.cy + TR.botRy * Math.sqrt(Math.max(0, 1 - uOf(x) * uOf(x)));

  const DIAL = { cx: 400, cy: 608, rOut: 52, rIn: 45, A0: -Math.PI * (150 / 180), A1: Math.PI * (30 / 180) };

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // front (near) face of the tray: near rim curve down to bottom curve
  function trayFrontPath(c) {
    c.beginPath();
    for (let x = TR.cx - TR.rx; x <= TR.cx + TR.rx; x += 4) c.lineTo(x, nearY(x));
    for (let x = TR.cx + TR.rx; x >= TR.cx - TR.rx; x -= 4) c.lineTo(x, botY(x));
    c.closePath();
  }
  function trayInteriorPath(c) {
    c.beginPath();
    for (let x = TR.cx - TR.rx; x <= TR.cx + TR.rx; x += 4) c.lineTo(x, farY(x));
    for (let x = TR.cx + TR.rx; x >= TR.cx - TR.rx; x -= 4) c.lineTo(x, nearY(x));
    c.closePath();
  }
  function trayCurve(c, fn) {
    c.beginPath();
    for (let x = TR.cx - TR.rx; x <= TR.cx + TR.rx; x += 4) c.lineTo(x, fn(x));
  }

  // ---------------- static scene (pre-rendered) ----------------
  const scene = document.createElement('canvas');
  scene.width = W; scene.height = H;
  const sc = scene.getContext('2d');

  function paintScene() {
    const c = sc;
    // room: near-black, warm
    c.fillStyle = '#0a0705';
    c.fillRect(0, 0, W, H);
    let g = c.createLinearGradient(0, 0, 520, 0);
    g.addColorStop(0, 'rgba(72,48,28,0.30)');
    g.addColorStop(1, 'rgba(72,48,28,0)');
    c.fillStyle = g; c.fillRect(0, 0, 520, H);

    // lamp pool on the wall, upper left
    g = c.createRadialGradient(250, 150, 20, 250, 150, 430);
    g.addColorStop(0, 'rgba(255,196,132,0.16)');
    g.addColorStop(0.5, 'rgba(255,196,132,0.05)');
    g.addColorStop(1, 'rgba(255,196,132,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    g = c.createRadialGradient(250, 150, 5, 250, 150, 170);
    g.addColorStop(0, 'rgba(255,216,164,0.13)');
    g.addColorStop(1, 'rgba(255,216,164,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    // table
    g = c.createLinearGradient(0, 684, 0, H);
    g.addColorStop(0, '#181009');
    g.addColorStop(1, '#0b0704');
    c.fillStyle = g; c.fillRect(0, 684, W, H - 684);
    // lamp pool on the table
    g = c.createRadialGradient(300, 706, 10, 300, 706, 330);
    g.addColorStop(0, 'rgba(216,150,88,0.13)');
    g.addColorStop(1, 'rgba(216,150,88,0)');
    c.fillStyle = g; c.fillRect(0, 684, W, H - 684);
    // table edge catches the light
    g = c.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(255,190,124,0.02)');
    g.addColorStop(0.31, 'rgba(255,190,124,0.24)');
    g.addColorStop(0.8, 'rgba(255,190,124,0)');
    c.fillStyle = g; c.fillRect(0, 683.4, W, 1.6);
    // faint wood grain
    c.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const y = 702 + i * 11 + rand(-3, 3);
      c.strokeStyle = 'rgba(255,196,132,' + (0.012 + rand(0, 0.018)).toFixed(3) + ')';
      c.beginPath();
      c.moveTo(0, y);
      for (let x = 0; x <= W; x += 80) c.lineTo(x, y + Math.sin(x * 0.013 + i * 2.1) * 2.2);
      c.stroke();
    }

    // cast shadow of the scale, falling to the right (light is upper-left)
    c.save();
    c.translate(430, 686);
    c.scale(1, 0.16);
    g = c.createRadialGradient(0, 0, 10, 0, 0, 170);
    g.addColorStop(0, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 170, 0, TAU); c.fill();
    c.restore();

    // ---- the scale ----
    // stem (behind tray and body)
    g = c.createLinearGradient(394, 0, 406, 0);
    g.addColorStop(0, '#3c2c19');
    g.addColorStop(0.3, '#5c4324');
    g.addColorStop(1, '#150e08');
    c.fillStyle = g; c.fillRect(394, 390, 12, 162);
    c.fillStyle = 'rgba(255,206,142,0.4)';
    c.fillRect(396.4, 392, 1.1, 158);

    // tray: interior (the mouth), then near face
    trayInteriorPath(c);
    g = c.createLinearGradient(0, 372, 0, 386);
    g.addColorStop(0, '#0c0805');
    g.addColorStop(1, '#1a1109');
    c.fillStyle = g; c.fill();
    c.save();
    trayInteriorPath(c); c.clip();
    // far wall shadow
    g = c.createLinearGradient(0, 372, 0, 381);
    g.addColorStop(0, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(300, 370, 200, 16);
    // lamp pool landing in the dish floor
    g = c.createRadialGradient(372, 382, 4, 372, 382, 48);
    g.addColorStop(0, 'rgba(255,186,122,0.10)');
    g.addColorStop(1, 'rgba(255,186,122,0)');
    c.fillStyle = g; c.fillRect(300, 370, 200, 22);
    c.restore();
    // far rim line
    trayCurve(c, farY);
    g = c.createLinearGradient(308, 0, 492, 0);
    g.addColorStop(0, 'rgba(208,154,98,0.6)');
    g.addColorStop(1, 'rgba(132,96,62,0.30)');
    c.strokeStyle = g; c.lineWidth = 1.4; c.stroke();

    trayFront(c);

    // body
    rr(c, 328, 548, 144, 124, 16);
    g = c.createLinearGradient(0, 548, 0, 672);
    g.addColorStop(0, '#372818');
    g.addColorStop(0.45, '#251b12');
    g.addColorStop(1, '#140f0a');
    c.fillStyle = g; c.fill();
    // left edge catches light
    g = c.createLinearGradient(328, 0, 356, 0);
    g.addColorStop(0, 'rgba(255,192,124,0.12)');
    g.addColorStop(1, 'rgba(255,192,124,0)');
    rr(c, 328, 548, 144, 124, 16); c.fillStyle = g; c.fill();
    // right edge falls into dark
    g = c.createLinearGradient(444, 0, 472, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    rr(c, 328, 548, 144, 124, 16); c.fillStyle = g; c.fill();
    // top edge highlight
    g = c.createLinearGradient(340, 0, 462, 0);
    g.addColorStop(0, 'rgba(255,198,132,0.32)');
    g.addColorStop(1, 'rgba(255,198,132,0.10)');
    c.fillStyle = g; c.fillRect(342, 549.2, 118, 1.6);

    // dial
    c.save();
    // recess shadow
    g = c.createRadialGradient(400, 608, 46, 400, 608, 56);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.30)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(400, 608, 56, 0, TAU); c.fill();
    // brass ring, lit from upper left
    g = c.createLinearGradient(362, 570, 438, 646);
    g.addColorStop(0, '#b08048');
    g.addColorStop(0.5, '#5e3f22');
    g.addColorStop(1, '#2c1c0f');
    c.fillStyle = g; c.beginPath(); c.arc(400, 608, DIAL.rOut, 0, TAU); c.fill();
    c.lineWidth = 1.4;
    c.strokeStyle = 'rgba(255,222,166,0.55)';
    c.beginPath(); c.arc(400, 608, DIAL.rOut, Math.PI * 0.98, Math.PI * 1.58); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.beginPath(); c.arc(400, 608, DIAL.rOut, -Math.PI * 0.02, Math.PI * 0.55); c.stroke();
    // face, light pooled toward upper left
    g = c.createRadialGradient(389, 597, 4, 400, 608, DIAL.rIn + 2);
    g.addColorStop(0, '#2c2015');
    g.addColorStop(1, '#140e09');
    c.fillStyle = g; c.beginPath(); c.arc(400, 608, DIAL.rIn, 0, TAU); c.fill();
    // ticks: 40 divisions over a 180-degree arc
    for (let i = 0; i <= 40; i++) {
      const a = lerp(DIAL.A0, DIAL.A1, i / 40);
      const major = i % 10 === 0;
      const r1 = major ? 34 : 37.5;
      c.strokeStyle = major ? 'rgba(233,206,168,0.85)' : 'rgba(233,206,168,0.30)';
      c.lineWidth = major ? 1.8 : 1;
      c.beginPath();
      c.moveTo(400 + Math.cos(a) * 42, 608 + Math.sin(a) * 42);
      c.lineTo(400 + Math.cos(a) * r1, 608 + Math.sin(a) * r1);
      c.stroke();
    }
    c.font = '10px Georgia, serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(233,206,168,0.78)';
    for (let i = 0; i <= 40; i += 10) {
      const a = lerp(DIAL.A0, DIAL.A1, i / 40);
      c.fillText(String(i), 400 + Math.cos(a) * 25.5, 608 + Math.sin(a) * 25.5 + 0.5);
    }
    // glass sheen, faint, upper left
    c.strokeStyle = 'rgba(255,232,200,0.05)';
    c.lineWidth = 7;
    c.beginPath(); c.arc(400, 608, 39, Math.PI * 1.05, Math.PI * 1.45); c.stroke();
    c.font = '8px Georgia, serif';
    c.fillStyle = 'rgba(222,192,152,0.34)';
    c.fillText('S O F T   W E I G H T', 400, 667.5);
    c.restore();

    // foot
    rr(c, 308, 664, 184, 22, 9);
    g = c.createLinearGradient(0, 664, 0, 686);
    g.addColorStop(0, '#392a1b');
    g.addColorStop(1, '#110c08');
    c.fillStyle = g; c.fill();
    g = c.createLinearGradient(314, 0, 486, 0);
    g.addColorStop(0, 'rgba(255,198,132,0.30)');
    g.addColorStop(1, 'rgba(255,198,132,0.05)');
    c.fillStyle = g; c.fillRect(316, 665.2, 168, 1.5);
  }

  // tray near face, painted over the seeds each frame (they sit inside the dish)
  function trayFront(c) {
    trayFrontPath(c);
    const g = c.createLinearGradient(0, 379, 0, 395);
    g.addColorStop(0, '#4b3620');
    g.addColorStop(1, '#16100a');
    c.fillStyle = g; c.fill();
    trayCurve(c, nearY);
    const g2 = c.createLinearGradient(308, 0, 492, 0);
    g2.addColorStop(0, 'rgba(255,206,142,0.55)');
    g2.addColorStop(1, 'rgba(255,206,142,0.10)');
    c.strokeStyle = g2; c.lineWidth = 1.8; c.stroke();
  }

  paintScene();

  // ---------------- matter: seeds fall and settle into the pan ----------------
  const engine = Engine.create();
  engine.world.gravity.y = 0.55;
  const world = engine.world;
  const FLOOR_Y = 383;
  Composite.add(world, [
    Bodies.rectangle(400, FLOOR_Y + 4, 156, 8, { isStatic: true }),
    Bodies.rectangle(333, 375, 7, 34, { isStatic: true, angle: 0.494 }),
    Bodies.rectangle(467, 375, 7, 34, { isStatic: true, angle: -0.494 }),
  ]);

  const MAXW = 40;
  const seeds = [];
  const ripples = [];

  function dropSeed(x) {
    if (seeds.length > 60) return;
    const r = rand(2.7, 4.1);
    const b = Bodies.circle(x, 150, r, {
      density: 1 / (Math.PI * r * r),
      friction: 0.9, frictionStatic: 1.1, restitution: 0.04, frictionAir: 0.012,
    });
    Composite.add(world, b);
    seeds.push({ b, r, settled: false, flash: 0, fade: 1, dying: false, dieT: 0, ph: rand(0, TAU), fr: rand(0.5, 1.4) });
  }

  function settledWeight() {
    let w = 0;
    for (const s of seeds) if (s.settled && !s.dying) w += 1;
    return w;
  }

  // ---------------- cycle: drip -> hold -> fade -> rest ----------------
  let state = 'drip', stateT = 0, nextDrop = 2.2, fadeQueue = null, fadeClock = 0;

  function stepCycle(t, dt) {
    if (state === 'drip') {
      if (t > nextDrop) {
        dropSeed(rand(352, 448));
        nextDrop = t + rand(1.2, 2.4);
      }
      if (settledWeight() >= MAXW) { state = 'hold'; stateT = t; }
    } else if (state === 'hold') {
      if (t - stateT > 7) {
        state = 'fade'; stateT = t; fadeClock = 0;
        fadeQueue = seeds.slice();
        for (let i = fadeQueue.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          const tmp = fadeQueue[i]; fadeQueue[i] = fadeQueue[j]; fadeQueue[j] = tmp;
        }
      }
    } else if (state === 'fade') {
      fadeClock += dt;
      while (fadeClock > 0.22 && fadeQueue.length) {
        fadeClock -= 0.22;
        const s = fadeQueue.shift();
        if (!s.dying) { s.dying = true; s.dieT = t; }
      }
      if (!fadeQueue.length) {
        let any = false;
        for (const s of seeds) if (s.dying && s.fade > 0) { any = true; break; }
        if (!any) { state = 'rest'; stateT = t; }
      }
    } else if (state === 'rest') {
      if (t - stateT > 2.6) { state = 'drip'; nextDrop = t + 1.4; }
    }
  }

  function stepSeeds(dt, t) {
    for (let i = seeds.length - 1; i >= 0; i--) {
      const s = seeds[i];
      if (s.dying) {
        s.fade = clamp(1 - (t - s.dieT) / 1.1, 0, 1);
        if (s.fade <= 0) { Composite.remove(world, s.b); seeds.splice(i, 1); }
        continue;
      }
      s.flash = Math.max(0, s.flash - dt * 1.8);
      if (!s.settled && s.b.speed < 0.3 && s.b.position.y > 340) {
        s.settled = true;
        s.flash = 1;
        ripples.push({ x: s.b.position.x, t0: t });
      }
    }
    for (let i = ripples.length - 1; i >= 0; i--) if (t - ripples[i].t0 > 0.6) ripples.splice(i, 1);
  }

  // ---------------- the needle: slow damped spring ----------------
  let nA = DIAL.A0 - 0.10, nV = 0;
  const NK = 3.0, NC = 2 * Math.sqrt(3.0) * 0.72;
  let wS = 0;
  function stepNeedle(dt) {
    const target = clamp(settledWeight() / MAXW, 0, 1);
    wS += (target - wS) * (1 - Math.exp(-6 * dt));
    const aT = lerp(DIAL.A0, DIAL.A1, wS);
    nV += (NK * (aT - nA) - NC * nV) * dt;
    nA += nV * dt;
  }

  // ---------------- dust motes in the lamp pool ----------------
  const motes = [];
  for (let i = 0; i < 14; i++) {
    motes.push({ x: rand(30, 430), y: rand(20, 460), r: rand(0.5, 1.3), a: rand(0.05, 0.14), vx: rand(2, 6), vy: rand(0.4, 1.6), ph: rand(0, TAU) });
  }
  function stepMotes(dt) {
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x > 450) { m.x = 20; m.y = rand(20, 460); }
      if (m.y > 480) { m.y = 10; m.x = rand(30, 430); }
    }
  }

  // ---------------- prose, one line as the needle goes down ----------------
  const lines = [
    { txt: 'each one, alone, is almost nothing', a: 0, on: () => wS >= 0.30 },
    { txt: 'but they keep landing, and the needle keeps sinking', a: 0, on: () => wS >= 0.60 },
    { txt: 'soft things only show their weight once you stop counting them', a: 0, on: () => state === 'hold' },
  ];
  function stepLines(dt) {
    for (const L of lines) {
      const target = L.on() ? 1 : 0;
      L.a += (target - L.a) * Math.min(1, dt * 0.9);
    }
  }

  // tap to drop a seed
  cvs.addEventListener('pointerdown', (e) => {
    const r = cvs.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    dropSeed(clamp(x, 350, 450));
  });

  // ---------------- render ----------------
  function render(t) {
    const c = ctx;
    c.drawImage(scene, 0, 0);

    // motes
    for (const m of motes) {
      const d = Math.hypot(m.x - 250, m.y - 150);
      const a = m.a * clamp(1 - d / 430, 0, 1) * (0.6 + 0.4 * Math.sin(t * 0.5 + m.ph));
      if (a < 0.008) continue;
      c.fillStyle = 'rgba(255,226,190,' + a.toFixed(3) + ')';
      c.beginPath(); c.arc(m.x, m.y, m.r, 0, TAU); c.fill();
    }

    // the pile's light
    c.globalCompositeOperation = 'lighter';
    if (seeds.length) {
      let cx = 0, cy = 0, n = 0;
      for (const s of seeds) { cx += s.b.position.x; cy += s.b.position.y; n++; }
      cx /= n; cy /= n;
      const boost = state === 'hold' ? 1.3 : 1;
      let g = c.createRadialGradient(cx, cy, 6, cx, cy, 74 + 1.1 * n);
      g.addColorStop(0, 'rgba(255,168,92,' + Math.min(0.22, 0.026 * n * boost).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,168,92,0)');
      c.fillStyle = g; c.fillRect(cx - 160, cy - 160, 320, 320);
      g = c.createRadialGradient(cx, cy, 2, cx, cy, 26 + 0.5 * n);
      g.addColorStop(0, 'rgba(255,196,128,' + Math.min(0.32, 0.05 * n * boost).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,196,128,0)');
      c.fillStyle = g; c.fillRect(cx - 100, cy - 100, 200, 200);
      // a little of it falls down on the stem
      g = c.createRadialGradient(400, 404, 4, 400, 404, 64);
      g.addColorStop(0, 'rgba(255,182,112,' + Math.min(0.28, 0.010 * n).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,182,112,0)');
      c.fillStyle = g; c.fillRect(336, 340, 128, 130);
    }

    // seeds: warm points of light
    for (const s of seeds) {
      const x = s.b.position.x, y = s.b.position.y;
      const fl = clamp(s.fade * (0.82 + 0.18 * Math.sin(t * s.fr + s.ph)) * (1 + s.flash), 0, 1.6);
      const hr = s.r * 3.8;
      const g = c.createRadialGradient(x, y, 0, x, y, hr);
      g.addColorStop(0, 'rgba(255,216,164,' + (0.50 * fl).toFixed(3) + ')');
      g.addColorStop(0.3, 'rgba(255,172,98,' + (0.26 * fl).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,172,98,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y, hr, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,238,204,' + Math.min(1, 0.92 * fl).toFixed(3) + ')';
      c.beginPath(); c.arc(x, y, s.r * 0.9, 0, TAU); c.fill();
    }

    // landings
    for (const rp of ripples) {
      const k = (t - rp.t0) / 0.6;
      c.strokeStyle = 'rgba(255,196,128,' + (0.22 * (1 - k)).toFixed(3) + ')';
      c.lineWidth = 1;
      c.beginPath();
      c.ellipse(rp.x, FLOOR_Y - 1, 5 + k * 10, 1.5 + k * 2.4, 0, 0, TAU);
      c.stroke();
    }
    c.globalCompositeOperation = 'source-over';

    // near face of the pan, over the pile
    trayFront(c);

    // needle, soft shadow falling to the right
    c.save();
    c.translate(DIAL.cx, DIAL.cy);
    c.rotate(nA);
    c.shadowColor = 'rgba(0,0,0,0.55)';
    c.shadowBlur = 5;
    c.shadowOffsetX = 2; c.shadowOffsetY = 3;
    const ng = c.createLinearGradient(0, -2.4, 0, 2.4);
    ng.addColorStop(0, '#64472c');
    ng.addColorStop(0.5, '#3a2817');
    ng.addColorStop(1, '#20140c');
    c.fillStyle = ng;
    c.beginPath();
    c.moveTo(-11, -1.6);
    c.lineTo(37, -0.5);
    c.lineTo(40, 0);
    c.lineTo(37, 0.5);
    c.lineTo(-11, 1.6);
    c.closePath();
    c.fill();
    c.shadowColor = 'transparent';
    c.strokeStyle = 'rgba(255,214,160,0.5)';
    c.lineWidth = 0.7;
    c.beginPath(); c.moveTo(-11, -1.6); c.lineTo(37, -0.5); c.stroke();
    c.restore();
    // hub
    c.save();
    c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 3; c.shadowOffsetX = 1.5; c.shadowOffsetY = 2;
    const hg = c.createRadialGradient(DIAL.cx - 1.6, DIAL.cy - 1.8, 0.5, DIAL.cx, DIAL.cy, 5.4);
    hg.addColorStop(0, '#d3a469');
    hg.addColorStop(1, '#452c15');
    c.fillStyle = hg;
    c.beginPath(); c.arc(DIAL.cx, DIAL.cy, 5.2, 0, TAU); c.fill();
    c.shadowColor = 'transparent';
    c.fillStyle = 'rgba(255,232,192,0.8)';
    c.beginPath(); c.arc(DIAL.cx - 1.6, DIAL.cy - 1.9, 1.2, 0, TAU); c.fill();
    c.restore();

    // prose
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = 0; i < lines.length; i++) {
      const L = lines[i];
      if (L.a < 0.01) continue;
      c.font = (i === 2 ? 'italic 14px Georgia, serif' : 'italic 15px Georgia, serif');
      c.fillStyle = 'rgba(234,217,189,' + (0.78 * L.a).toFixed(3) + ')';
      c.fillText(L.txt, 400, 716 + i * 24);
    }

    // captions
    c.textAlign = 'left';
    c.font = 'italic 12px Georgia, serif';
    c.fillStyle = 'rgba(230,208,178,0.48)';
    c.fillText('what settles', 22, H - 20);
    c.font = 'italic 11px Georgia, serif';
    c.fillStyle = 'rgba(230,208,178,0.30)';
    c.fillText('tap to drop a seed — or watch it rain', 22, H - 5);

    // the lamp breathes, very slowly
    c.globalCompositeOperation = 'lighter';
    const la = 0.012 + 0.007 * (0.5 + 0.5 * Math.sin(t * 0.19));
    let vg = c.createRadialGradient(250, 150, 20, 250, 150, 430);
    vg.addColorStop(0, 'rgba(255,196,132,' + la.toFixed(4) + ')');
    vg.addColorStop(1, 'rgba(255,196,132,0)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'source-over';

    // vignette
    vg = c.createRadialGradient(400, 390, 240, 400, 390, 590);
    vg.addColorStop(0, 'rgba(4,2,1,0)');
    vg.addColorStop(1, 'rgba(4,2,1,0.55)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
  }

  // ---------------- loop ----------------
  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    const t = now / 1000;
    stepCycle(t, dt);
    acc += dt;
    let steps = 0;
    while (acc >= 1 / 60 && steps < 3) { Engine.update(engine, 1000 / 60); acc -= 1 / 60; steps++; }
    if (steps === 3) acc = 0;
    stepSeeds(dt, t);
    stepNeedle(dt);
    stepMotes(dt);
    stepLines(dt);
    render(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // a small window onto the inside, for quiet pokes (and for testing)
  window.__settles = {
    dropSeed,
    info: () => ({ state, wS, nA, seeds: seeds.length, settled: settledWeight() }),
  };
})();
</script>
