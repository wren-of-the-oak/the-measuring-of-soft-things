<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Measuring of Soft Things — The Weight of Rain</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #04060a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(800px, 100vw, 100vh); height: min(800px, 100vw, 100vh); }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
(function () {
  const W = 800, H = 800, TAU = Math.PI * 2;
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');

  // ---- deterministic randomness ----
  let seed = 418032;
  function rng() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  }
  function rand(a, b) { return a + (b - a) * rng(); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // ---- value noise (for the stream bed and the sheet's slow breathing) ----
  const perm = new Uint8Array(512);
  (function () {
    const p = [];
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function valNoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = fade(xf), v = fade(yf);
    const A = perm[(xi + perm[yi & 255]) & 255] / 255;
    const B = perm[(xi + 1 + perm[yi & 255]) & 255] / 255;
    const C = perm[(xi + perm[(yi + 1) & 255]) & 255] / 255;
    const D = perm[(xi + 1 + perm[(yi + 1) & 255]) & 255] / 255;
    return lerp(lerp(A, B, u), lerp(C, D, u), v);
  }
  function fbm(x, y) {
    let s = 0, a = 0.5, f = 1;
    for (let o = 0; o < 3; o++) { s += a * valNoise(x * f, y * f); f *= 2; a *= 0.5; }
    return s / 0.875;
  }

  // ---- the water: the wax sheet's height field, tuned glassy ----
  // Same updater as the yield: the sheet chases a target, diffuses, heals.
  // Tuned for a thin sheet of water:
  //   fast diffusion (0.29, near the stable edge) — a strike fatters and
  //   runs outward quickly, like a ring let loose
  //   fast lag (0.80^dt) — the surface answers at once, nothing viscous
  //   very little healing (target 0.998^dt, sheet 0.9992^dt) — the weight
  //   of each strike stays in the water a long while
  const NX = 240, NY = 240, CW = W / NX, CH = H / NY;
  const hCur = new Float32Array(NX * NY);
  const hTgt = new Float32Array(NX * NY);
  const hTmp = new Float32Array(NX * NY);
  const gxArr = new Float32Array(NX * NY);
  const gyArr = new Float32Array(NX * NY);
  function gradField() {
    for (let y = 0; y < NY; y++) {
      const row = y * NX;
      for (let x = 0; x < NX; x++) {
        const i = row + x;
        const l = x > 0 ? hCur[i - 1] : hCur[i];
        const r = x < NX - 1 ? hCur[i + 1] : hCur[i];
        const u = y > 0 ? hCur[i - NX] : hCur[i];
        const d = y < NY - 1 ? hCur[i + NX] : hCur[i];
        gxArr[i] = (r - l) / (2 * CW);
        gyArr[i] = (d - u) / (2 * CH);
      }
    }
  }
  function fieldAt(f, x, y) {
    const fx = clamp(x / CW, 0, NX - 1.001), fy = clamp(y / CH, 0, NY - 1.001);
    const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
    const i = y0 * NX + x0;
    return lerp(lerp(f[i], f[i + 1], tx), lerp(f[i + NX], f[i + NX + 1], tx), ty);
  }

  // a strike's signature: a dent where it lands, a crown of displaced
  // water ringed a little way out. Fast diffusion carries the ring outward.
  const R = 48, SIG_C = 8.5, RING_R = 24, SIG_R = 9.5, CROWN = 1.3;
  let strikes = 0;
  function stamp(cx, cy, s) {
    const gx1 = Math.max(0, Math.floor((cx - R) / CW));
    const gx0 = Math.min(NX - 1, Math.ceil((cx + R) / CW));
    const gy1 = Math.max(0, Math.floor((cy - R) / CH));
    const gy0 = Math.min(NY - 1, Math.ceil((cy + R) / CH));
    const S2C = 2 * SIG_C * SIG_C, S2R = 2 * SIG_R * SIG_R;
    for (let gy = gy1; gy <= gy0; gy++) {
      const dyp = (gy + 0.5) * CH - cy;
      for (let gx = gx1; gx <= gx0; gx++) {
        const dxp = (gx + 0.5) * CW - cx;
        const d2 = dxp * dxp + dyp * dyp;
        if (d2 > R * R) continue;
        const dent = -s * Math.exp(-d2 / S2C);
        const dr = Math.sqrt(d2) - RING_R;
        const crown = s * CROWN * Math.exp(-(dr * dr) / S2R);
        const v = dent + crown;
        const i = gy * NX + gx;
        if (v < 0) { if (v < hTgt[i]) hTgt[i] = v; }
        else if (v > hTgt[i]) hTgt[i] = v;
      }
    }
    strikes++;
  }

  // ---- the pointer: smoothed, so the water feels a moment behind the hand ----
  const ptr = { x: -9999, y: -9999, ax: -9999, ay: -9999, px: -9999, py: -9999, down: false, on: false };
  function toCanvas(cx, cy) {
    const r = cvs.getBoundingClientRect();
    return { x: (cx - r.left) * (W / r.width), y: (cy - r.top) * (H / r.height) };
  }
  window.addEventListener('pointermove', (e) => {
    const p = toCanvas(e.clientX, e.clientY);
    if (!ptr.on) { ptr.ax = p.x; ptr.ay = p.y; ptr.px = p.x; ptr.py = p.y; }
    ptr.x = p.x; ptr.y = p.y; ptr.on = true;
    ptr.down = e.buttons > 0;
  });
  window.addEventListener('pointerdown', (e) => {
    const p = toCanvas(e.clientX, e.clientY);
    if (!ptr.on) { ptr.ax = p.x; ptr.ay = p.y; ptr.px = p.x; ptr.py = p.y; }
    ptr.x = p.x; ptr.y = p.y; ptr.on = true; ptr.down = true;
    audioInit();
    tick(0.075 + Math.random() * 0.045, (p.x / W) * 2 - 1);
  });
  window.addEventListener('pointerup', () => { ptr.down = false; });
  window.addEventListener('pointerleave', () => { ptr.on = false; ptr.down = false; });
  document.addEventListener('mouseleave', () => { ptr.on = false; ptr.down = false; });

  // ---- the tick: a soft wet plip — filtered noise splash + a low body thump,
  // every parameter jittered so no two strikes sound alike, and none of them
  // lands on a beat ----
  let AC = null, master = null, noiseBuf = null;
  function audioInit() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = 0.55;
      const lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 9000;
      master.connect(lp); lp.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, (AC.sampleRate * 0.3) | 0, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  function tick(gain, pan) {
    if (!AC || !noiseBuf) return;
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    // the splash: a slice of noise through a wandering band-pass
    const src = AC.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = 0.7 + Math.random() * 0.9;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 700 * (1.4 + Math.random() * 3.4);
    bp.Q.value = 1.2 + Math.random() * 4.5;
    const g1 = AC.createGain();
    const a1 = gain * (0.5 + Math.random() * 0.7);
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(Math.max(a1, 0.0002), t + 0.008 + Math.random() * 0.014);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + Math.random() * 0.09);
    src.connect(bp); bp.connect(g1);
    // the body: a short low thump, falling a little in pitch
    const osc = AC.createOscillator();
    osc.type = 'sine';
    const f0 = 150 + Math.random() * 190;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(55, f0 * 0.55), t + 0.09);
    const g2 = AC.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(Math.max(gain * 0.55, 0.0002), t + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07 + Math.random() * 0.09);
    osc.connect(g2);
    if (AC.createStereoPanner) {
      const p = AC.createStereoPanner();
      p.pan.value = clamp(pan * 0.55, -1, 1);
      g1.connect(p); g2.connect(p); p.connect(master);
    } else { g1.connect(master); g2.connect(master); }
    src.start(t, Math.random() * 0.12);
    src.stop(t + 0.4);
    osc.start(t); osc.stop(t + 0.3);
  }
  let lastTick = -9;
  function maybeTick(strength, time, pan) {
    // sparse and off-beat: a random gap and a coin flip, so a drag
    // patters like scattered drops, never like a metronome
    if (time - lastTick < 0.09 + Math.random() * 0.24) return;
    if (Math.random() < 0.45) return;
    lastTick = time;
    tick(0.035 + strength * 0.055, pan);
  }

  // ---- uninvited rain: when no one is touching the water, a few drops
  // still fall, at their own pace ----
  let lastAmbient = -99, nextAmbient = 1.1;
  function ambientDrop(time) {
    const x = rand(70, W - 70), y = rand(70, H - 70);
    stamp(x, y, rand(0.16, 0.4));
    tick(0.026 + Math.random() * 0.02, (x / W) * 2 - 1);
  }

  // ---- the stream bed under the sheet: dark slate, pebbles, a cold lamp ----
  const bed = (() => {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const lg = g.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, '#0d1219');
    lg.addColorStop(0.55, '#090d13');
    lg.addColorStop(1, '#06090d');
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);
    // a cool pool of light, upper left, like a lamp out of frame
    const rg = g.createRadialGradient(W * 0.32, H * 0.28, 60, W * 0.32, H * 0.28, 640);
    rg.addColorStop(0, 'rgba(110,150,190,0.13)');
    rg.addColorStop(1, 'rgba(110,150,190,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);
    // pebbles: soft ellipses a shade lighter than the bed
    for (let i = 0; i < 13; i++) {
      const x = rand(60, W - 60), y = rand(70, H - 70);
      const rx = rand(7, 26), ry = rx * rand(0.55, 0.82);
      const a = rand(0.08, 0.2);
      const pg = g.createRadialGradient(x - rx * 0.25, y - ry * 0.3, rx * 0.1, x, y, rx);
      pg.addColorStop(0, 'rgba(58,74,94,' + a + ')');
      pg.addColorStop(1, 'rgba(58,74,94,0)');
      g.save();
      g.translate(x, y); g.scale(1, ry / rx); g.translate(-x, -y);
      g.fillStyle = pg;
      g.beginPath(); g.arc(x, y, rx, 0, TAU); g.fill();
      g.restore();
      // a faint wet gleam along the upper edge
      g.strokeStyle = 'rgba(120,158,196,' + (a * 0.4).toFixed(3) + ')';
      g.lineWidth = 0.8;
      g.beginPath();
      g.ellipse(x, y, rx * 0.8, ry * 0.8, 0, Math.PI * 1.15, Math.PI * 1.85);
      g.stroke();
    }
    // a scatter of fine glints, like silt catching the lamp
    for (let i = 0; i < 46; i++) {
      const x = rng() * W, y = rng() * H, r = rand(0.4, 1.3);
      g.fillStyle = 'rgba(170,205,235,' + rand(0.025, 0.08).toFixed(3) + ')';
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    // mottling and grain, per pixel
    const img = g.getImageData(0, 0, W, H);
    const d = img.data;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const m1 = fbm(x / 170, y / 170) - 0.5;
        const m2 = fbm(x / 46 + 9.1, y / 46 + 4.7) - 0.5;
        const lf = 1.05 - 0.22 * (0.7 * (x / W) + 0.3 * (y / H) - 0.5);
        const v = (1 + m1 * 0.09 + m2 * 0.05 + (rng() - 0.5) * 0.05) * lf;
        const i = (y * W + x) * 4;
        d[i] *= v; d[i + 1] *= v; d[i + 2] *= v;
      }
    }
    g.putImageData(img, 0, 0);
    return g.getImageData(0, 0, W, H).data;
  })();

  const out = ctx.createImageData(W, H);
  const od = out.data;

  function render(time) {
    const breathe = 0.85 + 0.15 * Math.sin(time * 0.19);
    const k = 18; // how hard the ripples tilt the surface against the light
    // light from high, from the upper left
    const lx = -0.32, ly = -0.44, lz = 0.84;

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const gx = fieldAt(gxArr, x, y)
                 + 0.004 * (valNoise(x / 46 + time * 0.05, y / 46 + 9) - 0.5) * 2 * breathe;
        const gy = fieldAt(gyArr, x, y)
                 + 0.004 * (valNoise(x / 46 + 31, y / 46 + time * 0.045) - 0.5) * 2 * breathe;
        let nx = -gx * k, ny = -gy * k, nz = 1;
        const il = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx *= il; ny *= il; nz *= il;

        // the thin sheet: the bed shows through, shaded by the slope
        const ndl = clamp(nx * lx + ny * ly + nz * lz, 0, 1);
        const diff = 0.72 + 0.36 * ndl;
        // refraction: a thin sheet pulls the bed sideways at a steep tilt
        const u = clamp(x + nx * 30, 0, W - 1) | 0;
        const v = clamp(y + ny * 30, 0, H - 1) | 0;
        const ti = (v * W + u) * 4;
        let r = bed[ti] * diff;
        let g = bed[ti + 1] * diff;
        let b = bed[ti + 2] * diff;

        // the film of water itself, a whisper of cool
        r = r * 0.97 + 1.5;
        g = g * 0.985 + 2;
        b = b * 0.995 + 3.5;

        // the glassy turn: bright where the surface faces the lamp,
        // fresnel-brightened at grazing tilt
        const fres = 0.30 + 1.4 * (1 - nz);
        const spec = Math.pow(ndl, 28) * fres * 0.9;
        r += 225 * spec;
        g += 238 * spec;
        b += 255 * spec;

        const i = (y * W + x) * 4;
        od[i] = r < 0 ? 0 : r > 255 ? 255 : r;
        od[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
        od[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
        od[i + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);

    // the sheet's dark edge
    const vg = ctx.createRadialGradient(W / 2, H / 2, 250, W / 2, H / 2, 610);
    vg.addColorStop(0, 'rgba(2,4,7,0)');
    vg.addColorStop(1, 'rgba(2,4,7,0.66)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // quiet caption
    ctx.fillStyle = 'rgba(196,214,232,0.55)';
    ctx.font = 'italic 13px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText('the weight of rain', 22, H - 22);
    ctx.font = 'italic 11px Georgia, serif';
    ctx.fillStyle = 'rgba(196,214,232,0.38)';
    ctx.fillText('touch the water — every strike rings out and lingers a while', 22, H - 8);
  }

  // ---- loop ----
  let strength = 0;
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 16.6667;
    last = now;
    if (dt > 3) dt = 3;
    const time = now / 1000;

    // smoothed pointer chases the real one — the lag
    const f = 1 - Math.pow(0.84, dt);
    if (ptr.on) {
      ptr.ax += (ptr.x - ptr.ax) * f;
      ptr.ay += (ptr.y - ptr.ay) * f;
    }
    // a hover skims, a fast move cuts, a held press sinks the deepest
    const sp = ptr.on ? Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py) : 0;
    ptr.px = ptr.x; ptr.py = ptr.y;
    const press = ptr.on ? clamp(0.16 + sp * 0.05 + (ptr.down ? 0.5 : 0), 0.16, 1.2) : 0;
    strength += (press - strength) * (1 - Math.pow(0.82, dt));

    // the strike is a pulse: the target fades quickly, the sheet remembers slowly
    const decayT = Math.pow(0.998, dt);
    for (let i = 0; i < hTgt.length; i++) hTgt[i] *= decayT;
    if (ptr.on && strength > 0.02) {
      stamp(ptr.ax, ptr.ay, strength);
      maybeTick(strength, time, (ptr.ax / W) * 2 - 1);
    }
    if (time - lastAmbient > nextAmbient) {
      lastAmbient = time;
      nextAmbient = 1.6 + Math.random() * 3.4;
      ambientDrop(time);
    }

    // the sheet follows its target, spreads fast, and forgets slowly
    const diff = 0.29, lag = 1 - Math.pow(0.80, dt), heal = Math.pow(0.9992, dt);
    for (let y = 0; y < NY; y++) {
      const row = y * NX;
      for (let x = 0; x < NX; x++) {
        const i = row + x;
        const c = hCur[i];
        const l = x > 0 ? hCur[i - 1] : c;
        const r = x < NX - 1 ? hCur[i + 1] : c;
        const u = y > 0 ? hCur[i - NX] : c;
        const d = y < NY - 1 ? hCur[i + NX] : c;
        const diffused = c + diff * (l + r + u + d - 4 * c);
        hTmp[i] = diffused + (hTgt[i] - diffused) * lag;
      }
    }
    for (let i = 0; i < hCur.length; i++) hCur[i] = hTmp[i] * heal;
    gradField();

    render(time);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // a little handle, for poking from the console
  window.__rain = {
    drop: function (x, y, s) {
      stamp(x || W / 2, y || H / 2, s == null ? 0.42 : s);
      tick(0.05 + (s == null ? 0.03 : s * 0.06), ((x || W / 2) / W) * 2 - 1);
    },
    info: function () {
      let m = 0;
      for (let i = 0; i < hCur.length; i++) { const a = Math.abs(hCur[i]); if (a > m) m = a; }
      return { strikes, fieldMax: +m.toFixed(3), audio: !!AC };
    },
  };
})();
</script>
</body>
</html>
